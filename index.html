<style>
  /* ---------- Theme ---------- */
  :root {
    --bg: #fbf7f0; --surface: #efe6d8; --ink: #2a1d14; --muted: #7b6a5b; --line: rgba(60,40,20,.14);
    --accent: #a8602a; --accent-ink: #ffffff; --serif: "Playfair Display", "Amiri", Georgia, serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17110c; --surface: #261c14; --ink: #f4ebdd; --muted: #b2a08c; --line: rgba(255,235,210,.14); --accent: #e0a15e; --accent-ink: #17110c; color-scheme: dark; }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body {
    font-family: "Inter", "Cairo", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.7;
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  h1, h2, h3, p { overflow-wrap: anywhere; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ---------- Header: menu + search on the left, the name in the middle ---------- */
  header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  @supports (backdrop-filter: blur(8px)) {
    header.top { background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  }
  .head-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 68px; padding: 6px 16px; }
  .head-left { display: flex; justify-self: start; }
  header.top h1 { min-width: 0; text-align: center; font-family: var(--serif); font-size: clamp(1.2rem, 4.5vw, 1.7rem); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; line-height: 1.3; }

  /* Search: the icon opens into a bar in place */
  .search-anchor { position: relative; width: 44px; height: 44px; }
  .search-row { position: absolute; left: 0; top: 2px; z-index: 12; width: 44px; height: 40px; border-radius: 4px; opacity: 0; visibility: hidden; transition: width .28s ease, opacity .15s, visibility 0s .28s; }
  .search-anchor.open .search-row { width: min(220px, calc(100vw - 132px)); opacity: 1; visibility: visible; box-shadow: 0 6px 20px rgba(0,0,0,.14); transition: width .28s ease, opacity .15s; }
  .search-anchor.open #searchBtn { visibility: hidden; }
  .search { position: relative; display: flex; align-items: center; height: 40px; overflow: hidden; border-radius: 4px; }
  .search > svg { position: absolute; left: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 40px; padding: 0 36px 0 44px; font-size: .9rem; font-family: inherit; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 4px; -webkit-appearance: none; appearance: none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search .clear { position: absolute; right: 3px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: none; align-items: center; justify-content: center; }
  .search .clear svg { width: 16px; height: 16px; }
  .search.has-text .clear { display: flex; }
  .suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 13; list-style: none; max-height: 260px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.16); }
  .suggest button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 10px 12px; font-size: .9rem; cursor: pointer; overflow-wrap: anywhere; }
  .suggest button:hover, .suggest button:focus-visible { background: var(--surface); }
  .suggest small { margin-left: auto; flex: 0 0 auto; color: var(--muted); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }

  /* ---------- Side menu: sections, contact, rating ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41; width: min(320px, 86vw); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 0 30px rgba(0,0,0,.25); transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
  body.drawer-open .scrim { opacity: 1; visibility: visible; transition: opacity .25s; }
  body.drawer-open .drawer { transform: none; visibility: visible; transition: transform .25s ease; }
  .drawer-head { display: flex; align-items: center; justify-content: flex-end; padding: 14px 8px 14px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head .icon-btn svg { width: 18px; height: 18px; }
  .cat-list { list-style: none; padding: 8px 0; }
  .cat-list button { width: 100%; display: flex; align-items: center; padding: 15px 20px; text-align: start; background: transparent; border: 0; cursor: pointer; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; overflow-wrap: anywhere; }
  .cat-list button:hover { background: var(--surface); }
  .cat-list .none { padding: 14px 18px; color: var(--muted); font-size: .95rem; }
  .drawer-extra { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 4px; }
  .acc-head { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 15px 20px; background: none; border: 0; cursor: pointer; text-align: start; font-size: .85rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .acc-head svg { width: 18px; height: 18px; flex: 0 0 auto; transition: transform .2s; }
  .acc-head[aria-expanded="true"] svg { transform: rotate(180deg); }
  .acc-body { padding: 0 20px 16px; }
  .acc-body .sub { margin: 14px 0 2px; font-size: .74rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .acc-body a.num { display: block; padding: 9px 0; color: var(--ink); text-decoration: none; font-weight: 600; direction: ltr; text-align: start; border-bottom: 1px solid var(--line); }
  .acc-body a.num small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .stars { display: flex; gap: 4px; direction: ltr; }
  .stars button { width: 44px; height: 44px; padding: 6px; background: none; border: 0; color: var(--line); cursor: pointer; }
  .stars button svg { width: 100%; height: 100%; }
  .stars button.on { color: #e3a41a; }
  .rate-msg { margin-top: 10px; font-size: .92rem; }
  .rate-link { display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: .9rem; text-decoration: none; }

  /* ---------- Menu ---------- */
  main { flex: 1 0 auto; width: 100%; padding-bottom: 64px; }
  .sec { margin-top: 34px; scroll-margin-top: 84px; }
  .sec:first-child { margin-top: 28px; }
  .sec h2 { display: flex; align-items: center; justify-content: center; gap: 16px; font-family: var(--serif); font-size: 1.2rem; letter-spacing: .03em; }
  .sec h2::before, .sec h2::after { content: ""; flex: 1 1 0; height: 1px; background: var(--accent); opacity: .55; }
  .state { text-align: center; color: var(--muted); padding: 70px 20px; }
  .state b { display: block; color: var(--ink); font-size: 1.15rem; margin-bottom: 4px; }

  .card { min-width: 0; }
  .card .pic { overflow: hidden; background: var(--surface); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card h3 { font-size: 1rem; font-weight: 700; letter-spacing: .01em; line-height: 1.4; }
  .card .price { color: var(--accent); font-weight: 700; font-size: 1.02rem; margin-top: 3px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sizes span { font-size: .82rem; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; }
  .sizes b { color: var(--accent); font-weight: 700; margin-inline-start: 4px; }

  /* Suggestions: a row that scrolls sideways */
  .rail { display: flex; gap: 14px; margin: 14px -16px 0; padding: 0 16px 4px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .card { flex: 0 0 calc((100% - 14px) / 2.3); max-width: 240px; scroll-snap-align: start; }
  .rail .pic { aspect-ratio: 3 / 4; }
  .rail .body { margin-top: 12px; }
  .rail .sizes { display: none; }

  /* Sections: picture on the side, text next to it (flips by itself for Arabic names) */
  .list { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 36px; margin-top: 12px; }
  @media (min-width: 760px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .list .card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .list .pic { flex: 0 0 108px; width: 108px; height: 108px; border-radius: 12px; }
  .list .body { flex: 1 1 0; min-width: 0; }

  /* ---------- Footer ---------- */
  footer { background: #2a1d14; color: #d8c8b4; padding: 26px 0 calc(26px + env(safe-area-inset-bottom)); text-align: center; }
  footer .name { color: #fff; font-size: 1.15rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .socials { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
  .socials span { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.22); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .socials svg { width: 20px; height: 20px; }

  /* ---------- Entry page and loading screen: frosted glass (iOS style) ---------- */
  body.gated { overflow: hidden; height: 100vh; height: 100dvh; }
  body.gated > header, body.gated > main, body.gated > footer { filter: blur(14px); pointer-events: none; user-select: none; -webkit-user-select: none; transform: scale(1.03); }
  .gate, .loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); overflow-y: auto; }
  .gate { z-index: 100; }
  .loader { z-index: 200; transition: opacity .3s ease, visibility .3s ease; }
  .loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-card, .loader-box { text-align: center; color: var(--ink); background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.55); -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8); box-shadow: 0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.6); }
  @media (prefers-color-scheme: dark) {
    .gate-card, .loader-box { background: rgba(38,32,28,.6); border-color: rgba(255,255,255,.14); box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12); }
  }
  .gate-card { width: 100%; max-width: 340px; padding: 30px 22px 24px; border-radius: 28px; }
  .gate-hello { font-size: .95rem; font-weight: 500; letter-spacing: .06em; color: var(--muted); }
  .gate-card h2 { font-family: var(--serif); font-size: 2rem; line-height: 1.3; margin: 2px 0 14px; }
  .gate-card label { display: block; text-align: start; font-size: .78rem; font-weight: 600; letter-spacing: .04em; margin: 12px 4px 6px; color: var(--muted); }
  .gate-card input { width: 100%; padding: 13px 14px; font: inherit; font-size: 1rem; color: var(--ink); background: rgba(120,120,128,.16); border: 1.5px solid transparent; border-radius: 13px; outline: none; }
  .gate-card input:focus { border-color: var(--accent); background: rgba(120,120,128,.1); }
  .gate-err { margin-top: 12px; color: #c0332a; font-size: .86rem; }
  .gate-card button { width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer; }
  .gate-card button:disabled { opacity: .6; cursor: default; }
  .loader-box { width: 132px; padding: 22px 12px 18px; border-radius: 22px; }
  .loader-box p { margin-top: 12px; font-size: .9rem; font-weight: 600; letter-spacing: .04em; }
  .spinner { position: relative; width: 34px; height: 34px; margin: 0 auto; }
  .spinner i { position: absolute; left: 50%; top: 0; width: 3px; height: 9px; margin-left: -1.5px; border-radius: 2px; background: currentColor; opacity: .15; transform-origin: 50% 17px; transform: rotate(calc(var(--n) * 30deg)); animation: spoke 1s linear infinite; animation-delay: calc((var(--n) - 12) * .08333s); }
  @keyframes spoke { from { opacity: 1; } to { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .spinner i { animation-duration: 2.4s; } }
</style>
</head>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const str = (v) => (typeof v === "string" ? v : "");

let data = {};
try { data = JSON.parse($("data").textContent) || {}; } catch (e) { data = {}; }

// Only well-formed items are used: an object whose image is real image data.
const items = (Array.isArray(data.items) ? data.items : [])
  .filter((it) => it && typeof it === "object" && str(it.image).startsWith("data:image/"))
  .map((it) => ({
    image: it.image, title: str(it.title), price: str(it.price).trim(), cat: str(it.cat), best: it.best === true,
    sizes: (Array.isArray(it.sizes) ? it.sizes : []).map(str).filter(Boolean),
  }));
const categories = (Array.isArray(data.categories) ? data.categories : [])
  .filter((c) => c && str(c.id) && str(c.name) && items.some((it) => it.cat === c.id))
  .map((c) => ({ id: c.id, name: c.name }));

/* ---------- Loading screen ---------- */
const loader = $("loader");
const showLoader = () => loader.classList.remove("hide");
const hideLoader = () => loader.classList.add("hide");
{
  const pageLoaded = document.readyState === "complete" ? Promise.resolve() : new Promise((r) => window.addEventListener("load", r, { once: true }));
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready.catch(() => {}) : Promise.resolve();
  const timeout = new Promise((r) => setTimeout(r, 3500));   // never keep the visitor waiting on a slow font
  Promise.race([Promise.all([pageLoaded, fontsReady]), timeout]).then(hideLoader);
}

/* ---------- Entry page: name + phone, sent to the restaurant's Telegram ---------- */
{
  const endpoint = data.leads === true ? "/api/lead" : "";   // a small server function that forwards the entry to Telegram
  const live = !data.preview;   // the admin's preview must not send test entries
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked: nothing to keep */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  // Resolves when the server answered (even a refusal, which retrying would not fix); rejects when it could not be reached or failed.
  const send = (payload) => fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then((r) => { if (r.status >= 500) throw new Error("server"); });
  const openMenu = () => { document.body.classList.remove("gated"); $("gate").hidden = true; window.scrollTo(0, 0); };

  if (!endpoint) {
    openMenu();   // entry page switched off: straight to the menu
  } else {
    // An entry saved while the visitor was offline (or the server was down) is sent now.
    const pending = live ? store.get("menuPending") : null;
    if (pending) { try { send(JSON.parse(pending)).then(() => store.del("menuPending")).catch(() => {}); } catch (e) { store.del("menuPending"); } }

    $("gate").hidden = false;   // shown on every visit
    const err = (text) => { $("gateErr").textContent = text; $("gateErr").hidden = !text; };
    const latin = (v) => String(v).replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x6F0);
    $("gateForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const name = $("gName").value.trim().replace(/\s+/g, " ");
      const phone = latin($("gPhone").value).replace(/[\s\-()]/g, "");
      if (name.length < 2) { err("Please enter your name · من فضلك اكتب اسمك"); $("gName").focus(); return; }
      if (!/^\+?\d{8,15}$/.test(phone)) { err("Please enter a valid mobile number · اكتب رقم موبايل صحيح"); $("gPhone").focus(); return; }
      err("");
      $("gateBtn").disabled = true;
      if (live) {
        showLoader();
        const payload = { name, phone };
        try { await Promise.race([send(payload), new Promise((r) => setTimeout(r, 10000))]); }
        catch (e) { store.set("menuPending", JSON.stringify(payload)); }   // not delivered: kept and sent on the next visit
      }
      openMenu();
      hideLoader();
      $("gateBtn").disabled = false;
    });
  }
}

/* ---------- Page details ---------- */
if (str(data.logo).startsWith("data:image/")) {
  const icon = document.createElement("link");
  icon.rel = "icon";
  icon.href = data.logo;
  document.head.append(icon);
}
{
  const has = { whatsapp: !!str(data.phone).replace(/\D/g, ""), ...Object.fromEntries(Object.entries(data.social && typeof data.social === "object" ? data.social : {}).map(([k, v]) => [k, /^https:\/\//i.test(str(v))])) };
  let any = false;
  for (const key of ["whatsapp", "instagram", "facebook", "telegram"]) {
    $("soc-" + key).hidden = !has[key];
    if (has[key]) any = true;
  }
  $("socials").hidden = !any;
}

/* ---------- Menu ---------- */
const TAIL_SIZE = /^(.*?)[\s=:\-–]*(\d+(?:[.,]\d+)?)$/;   // "صغير 90", "M = 120", "L: 150"

function priceText(p) { return /^\d+([.,]\d+)?$/.test(p) ? p + " ج.م" : p; }   // "90" -> "90 ج.م"; other text is shown as written

function makeCard(it) {
  const card = document.createElement("article");
  card.className = "card";
  card.dir = "auto";   // Arabic items read right-to-left, English ones left-to-right

  const pic = document.createElement("div");
  pic.className = "pic";
  const img = document.createElement("img");
  img.src = it.image;
  img.alt = "";
  img.loading = "lazy";
  img.draggable = false;
  pic.append(img);

  const body = document.createElement("div");
  body.className = "body";
  const h = document.createElement("h3");
  h.textContent = it.title;
  body.append(h);
  if (it.price) {
    const p = document.createElement("p");
    p.className = "price";
    p.textContent = priceText(it.price);
    body.append(p);
  }
  if (it.sizes.length) {
    const row = document.createElement("div");
    row.className = "sizes";
    for (const s of it.sizes) {
      const m = s.trim().match(TAIL_SIZE);
      const chip = document.createElement("span");
      chip.append(m && m[1] ? m[1].trim() : s.trim());
      if (m && m[1]) { const b = document.createElement("b"); b.textContent = m[2]; chip.append(b); }
      row.append(chip);
    }
    body.append(row);
  }
  card.append(pic, body);
  return card;
}

function makeSection(title, list, { rail = false, catId = "" } = {}) {
  const sec = document.createElement("section");
  sec.className = "sec";
  if (catId) sec.dataset.cat = catId;
  if (title) {
    const h2 = document.createElement("h2");
    h2.textContent = title;
    sec.append(h2);
  }
  const box = document.createElement("div");
  box.className = rail ? "rail" : "list";
  list.forEach((it) => box.append(makeCard(it)));
  sec.append(box);
  $("menu").append(sec);
}

/* Search: matches the item name or its section name (Arabic spelling variants are treated alike) */
const normalize = (v) => String(v).toLowerCase().normalize("NFKD").replace(/[̀-ًͯ-ٰٟـ]/g, "").replace(/[آأإ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
const words = (v) => normalize(v).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
const catName = Object.fromEntries(categories.map((c) => [c.id, normalize(c.name)]));
let query = "";

function matches(it) {
  const terms = words(query);
  const hay = normalize(it.title) + " " + (catName[it.cat] || "");
  return terms.every((t) => hay.includes(t));
}

function render() {
  $("menu").textContent = "";
  const view = items.filter(matches);
  if (!view.length) {
    const box = document.createElement("div");
    box.className = "state";
    const b = document.createElement("b");
    b.textContent = items.length ? "No results" : "No items yet";
    box.append(b, items.length ? "Try a different word." : "They'll show up here once they're added.");
    $("menu").append(box);
    return;
  }
  const best = view.filter((it) => it.best);
  if (!words(query).length && best.length) makeSection("Our Suggestion for You", best, { rail: true });
  for (const c of categories) {
    const list = view.filter((it) => it.cat === c.id);
    if (list.length) makeSection(c.name, list, { catId: c.id });
  }
  const rest = view.filter((it) => !catName[it.cat]);
  if (rest.length) makeSection("", rest);
}

/* ---------- Side menu ---------- */
const menuBtn = $("menuBtn");
function openDrawer() { document.body.classList.add("drawer-open"); menuBtn.setAttribute("aria-expanded", "true"); $("drawerClose").focus({ preventScroll: true }); }
function closeDrawer() { document.body.classList.remove("drawer-open"); menuBtn.setAttribute("aria-expanded", "false"); }

function goToCategory(id) {
  closeDrawer();
  const find = () => [...document.querySelectorAll("section.sec")].find((x) => x.dataset.cat === id);
  if (!find() && query) setQuery("");   // a search may be hiding that section
  const sec = find();
  if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
}

for (const c of categories) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c.name;
  b.addEventListener("click", () => goToCategory(c.id));
  li.append(b);
  $("catList").append(li);
}
if (!categories.length) {
  const li = document.createElement("li");
  li.className = "none";
  li.textContent = "No sections yet";
  $("catList").append(li);
}
menuBtn.addEventListener("click", openDrawer);
$("drawerClose").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);

// Contact us: WhatsApp first, then the restaurant's phone numbers
{
  const body = $("contactBody");
  const wa = str(data.phone).replace(/\D/g, "");
  const lines = (Array.isArray(data.phones) ? data.phones : []).map(str).filter(Boolean);
  const link = (text, href, note) => {
    const a = document.createElement("a");
    a.className = "num";
    if (href) a.href = href;
    if (href && href.startsWith("https:")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.append(text);
    if (note) { const small = document.createElement("small"); small.textContent = note; a.append(small); }
    body.append(a);
  };
  if (wa) link("WhatsApp", "https://wa.me/" + wa, "Chat with us");
  if (lines.length) {
    const sub = document.createElement("p");
    sub.className = "sub";
    sub.textContent = "Our phone numbers";
    body.append(sub);
    for (const line of lines) {
      const m = line.match(/\+?\d[\d\s\-()]{5,}\d/);
      link(line, m ? "tel:" + m[0].replace(/[^\d+]/g, "") : "");
    }
  }
  $("contactBox").hidden = !body.children.length;

  const toggle = (btn, panel) => btn.addEventListener("click", () => {
    const open = panel.hidden;
    panel.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  });
  toggle($("contactBtn"), body);
  toggle($("rateBtn"), $("rateBody"));

  // Rate us: 1-5 stars. Good ratings can go to Google; low ones open a WhatsApp message to the restaurant.
  const stars = [...$("stars").querySelectorAll("button")];
  const msg = $("rateMsg"), rateLink = $("rateLink");
  const review = str(data.review).startsWith("https://") ? data.review : "";
  for (const btn of stars) {
    btn.addEventListener("click", () => {
      const n = Number(btn.dataset.n);
      stars.forEach((x) => { x.classList.toggle("on", Number(x.dataset.n) <= n); x.setAttribute("aria-checked", String(Number(x.dataset.n) === n)); });
      rateLink.hidden = true;
      msg.hidden = false;
      if (n >= 4) {
        msg.textContent = "Thank you! We're glad you enjoyed it.";
        if (review) { rateLink.href = review; rateLink.textContent = "Rate us on Google"; rateLink.hidden = false; }
      } else {
        msg.textContent = "Thank you for telling us. We'd like to do better.";
        if (wa) { rateLink.href = "https://wa.me/" + wa + "?text=" + encodeURIComponent("My rating: " + n + "/5\n"); rateLink.textContent = "Tell us what went wrong"; rateLink.hidden = false; }
      }
    });
  }
}

/* ---------- Search box ---------- */
const searchAnchor = $("searchAnchor"), searchBtn = $("searchBtn"), searchRow = $("searchRow"), searchWrap = $("searchWrap"), q = $("q"), suggest = $("suggest");
const hideSuggestions = () => { suggest.hidden = true; };

function suggestionList() {
  const terms = words(query);
  if (!terms.length) return [];
  const typed = normalize(query).trim();
  const out = [], seen = new Set();
  const add = (text, tag) => { const key = normalize(text); if (seen.has(key) || key === typed) return; seen.add(key); out.push({ text, tag }); };
  for (const c of categories) if (terms.every((t) => catName[c.id].includes(t))) add(c.name, "Section");
  for (const it of items) if (it.title && terms.every((t) => normalize(it.title).includes(t))) add(it.title, "");
  return out.slice(0, 6);
}

function showSuggestions() {
  const list = suggestionList();
  suggest.textContent = "";
  for (const sg of list) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.append(sg.text);
    if (sg.tag) { const tag = document.createElement("small"); tag.textContent = sg.tag; b.append(tag); }
    b.addEventListener("click", () => { setQuery(sg.text); hideSuggestions(); });
    li.append(b);
    suggest.append(li);
  }
  suggest.hidden = !list.length;
}

function setQuery(text) {
  query = text;
  q.value = text;
  searchWrap.classList.toggle("has-text", !!text);
  render();
}

function setSearchOpen(open) {
  searchAnchor.classList.toggle("open", open);
  searchBtn.setAttribute("aria-expanded", String(open));
  if (open) q.focus({ preventScroll: true });
  else { hideSuggestions(); if (searchRow.contains(document.activeElement)) searchBtn.focus({ preventScroll: true }); }
}

q.addEventListener("input", () => { setQuery(q.value); showSuggestions(); });
q.addEventListener("focus", showSuggestions);
q.addEventListener("keydown", (ev) => { if (ev.key === "Enter") hideSuggestions(); });
$("clearQ").addEventListener("click", () => { setQuery(""); q.focus(); showSuggestions(); });
searchBtn.addEventListener("click", () => setSearchOpen(true));
document.addEventListener("click", (ev) => {
  if (searchAnchor.classList.contains("open") && !searchRow.contains(ev.target) && !searchBtn.contains(ev.target)) setSearchOpen(false);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  closeDrawer();
  if (searchAnchor.classList.contains("open")) setSearchOpen(false);
});

render();
</script>
